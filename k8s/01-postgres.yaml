apiVersion: v1
kind: Secret
metadata:
  name: MoamelAlRubaye-postgres-secret
type: Opaque
stringData:
  POSTGRES_DB: webstackdb
  POSTGRES_USER: admin
  POSTGRES_PASSWORD: geheim123
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: MoamelAlRubaye-postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: MoamelAlRubaye-postgres
spec:
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: MoamelAlRubaye-postgres
  template:
    metadata:
      labels:
        app: MoamelAlRubaye-postgres
    spec:
      containers:
        - name: MoamelAlRubaye-postgres-container
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: MoamelAlRubaye-postgres-secret
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
              subPath: postgres
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: MoamelAlRubaye-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
spec:
  type: ClusterIP
  selector:
    app: MoamelAlRubaye-postgres
  ports:
    - port: 5432
      targetPort: 5432