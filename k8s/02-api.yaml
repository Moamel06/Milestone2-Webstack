apiVersion: apps/v1
kind: Deployment
metadata:
  name: MoamelAlRubaye-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: MoamelAlRubaye-api
  template:
    metadata:
      labels:
        app: MoamelAlRubaye-api
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - MoamelAlRubaye-api
                topologyKey: kubernetes.io/hostname
      containers:
        - name: MoamelAlRubaye-api-container
          image: mootje1/MoamelAlRubaye-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DB_HOST
              value: "postgres-service"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: MoamelAlRubaye-postgres-secret
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: MoamelAlRubaye-postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: MoamelAlRubaye-postgres-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: MoamelAlRubaye-api-service
spec:
  type: ClusterIP
  selector:
    app: MoamelAlRubaye-api
  ports:
    - port: 8000
      targetPort: 8000