apiVersion: apps/v1
kind: Deployment
metadata:
  name: ma-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ma-frontend
  template:
    metadata:
      labels:
        app: ma-frontend
    spec:
      containers:
        - name: ma-frontend-container
          image: mootje1/ma-frontend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: ma-frontend-service
spec:
  type: ClusterIP
  selector:
    app: ma-frontend
  ports:
    - port: 80
      targetPort: 80