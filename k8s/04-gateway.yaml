apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ma-gateway
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ma-webstack-route
spec:
  parentRefs:
    - name: ma-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: ma-api-service
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ma-frontend-service
          port: 80



